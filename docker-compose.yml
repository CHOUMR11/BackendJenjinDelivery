version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: jenjon-postgres
    environment:
      POSTGRES_DB: jenjon_delivery
      POSTGRES_USER: jenjon
      POSTGRES_PASSWORD: jenjon
    ports:
      - "5432:5432"
    volumes:
      - jenjon_pgdata:/var/lib/postgresql/data

volumes:
  jenjon_pgdata:
